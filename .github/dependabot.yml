version: 2
updates:
  - package-ecosystem: npm
    directory: /WorkspaceOptimizer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Majors are deliberately left out so a Vite or PrimeVue jump lands on its own PR.
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # PrimeTek relicensed the PrimeUI family from MIT to a commercial license at the
      # next major (primevue 5, primeicons 8, @primeuix/themes 3). Those terms forbid
      # redistribution and removing the license notice, which GPL-3 section 7 does not
      # permit this project to accept. Revisit only as a deliberate decision.
      - dependency-name: primevue
        update-types: ["version-update:semver-major"]
      - dependency-name: "@primeuix/themes"
        update-types: ["version-update:semver-major"]
      # Temporary, unlike the two above. vue-tsc resolves 'typescript/lib/tsc', which
      # TypeScript 7 no longer exports, and its peer range of >=5.0.0 lets npm install
      # the combination anyway so it only fails at runtime. Lift this once
      #   grep typescript/lib/tsc node_modules/vue-tsc/index.js
      # comes back empty.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch, major]
