name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - run: npm ci
        working-directory: WorkspaceOptimizer
      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs
          path: /home/runner/.npm/_logs/
          if-no-files-found: ignore
      - run: npm run build
        working-directory: WorkspaceOptimizer
        env:
          VITE_BASE_URL: /
          # ── White-labeling (optional) ───────────────────────────────────
          # Forks can rebrand the build with zero code changes by setting these
          # repository Variables: Settings → Secrets and variables → Actions →
          # Variables. All are optional; unset ones fall back to defaults.
          # See README → "White-labeling for forks".
          VITE_BRAND_NAME:        ${{ vars.VITE_BRAND_NAME }}
          VITE_BRAND_VENDOR:      ${{ vars.VITE_BRAND_VENDOR }}
          VITE_BRAND_URL:         ${{ vars.VITE_BRAND_URL }}
          VITE_BRAND_DESCRIPTION: ${{ vars.VITE_BRAND_DESCRIPTION }}
          VITE_BRAND_LOGO_VALUE:  ${{ vars.VITE_BRAND_LOGO_VALUE }}
          VITE_BRAND_ACCENT:      ${{ vars.VITE_BRAND_ACCENT }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./WorkspaceOptimizer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
