name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: WorkspaceOptimizer/.nvmrc
      - run: npm ci
        working-directory: WorkspaceOptimizer
      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs
          path: /home/runner/.npm/_logs/
          if-no-files-found: ignore
      # Fails when index.json no longer matches the XML files beside it, so a forgotten
      # `npm run catalog:sync` is caught here rather than shipping a stale catalog.
      - name: Check marketplace catalog is in sync
        run: npm run catalog:check
        working-directory: WorkspaceOptimizer
      - run: npm run test
        working-directory: WorkspaceOptimizer
      # Re-checked here because an admin push to main bypasses pr-validate, and this is the
      # checkout that becomes the published file. Authenticode needs Windows, so the two
      # signature tests skip; what runs here is the line-ending and encoding guard.
      - name: Validate the published PowerShell script
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          $config = New-PesterConfiguration
          $config.Run.Path = 'WorkspaceOptimizer/tests/powershell'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config
      - run: npm run build
        working-directory: WorkspaceOptimizer
        env:
          VITE_BASE_URL: /
          # ── White-labeling (optional) ───────────────────────────────────
          # Forks can rebrand the build with zero code changes by setting these
          # repository Variables: Settings → Secrets and variables → Actions →
          # Variables. All are optional; unset ones fall back to defaults.
          # See README → "White-labeling for forks".
          VITE_BRAND_NAME:        ${{ vars.VITE_BRAND_NAME }}
          VITE_BRAND_VENDOR:      ${{ vars.VITE_BRAND_VENDOR }}
          VITE_BRAND_URL:         ${{ vars.VITE_BRAND_URL }}
          VITE_BRAND_DESCRIPTION: ${{ vars.VITE_BRAND_DESCRIPTION }}
          VITE_BRAND_LOGO_VALUE:  ${{ vars.VITE_BRAND_LOGO_VALUE }}
          VITE_BRAND_ACCENT:      ${{ vars.VITE_BRAND_ACCENT }}
          # Source repository, linked from an empty Marketplace. Unset = the upstream
          # project; set "none" to show no link at all.
          VITE_BRAND_REPO_URL:    ${{ vars.VITE_BRAND_REPO_URL }}
          # ── Marketplace (optional) ──────────────────────────────────────
          # One or more catalog URLs, separated by a comma, semicolon or newline
          # (not spaces). These are ADDED to the catalog bundled in public/; set
          # VITE_MARKETPLACE_DISABLE_BUNDLED to use only your own. Hosts must send
          # Access-Control-Allow-Origin (raw.githubusercontent.com does).
          VITE_MARKETPLACE_URL:            ${{ vars.VITE_MARKETPLACE_URL }}
          VITE_MARKETPLACE_DISABLE_BUNDLED: ${{ vars.VITE_MARKETPLACE_DISABLE_BUNDLED }}
          # Hosts whose content may be imported without a confirmation prompt.
          # Same-origin content is always trusted; this extends that to named hosts.
          VITE_MARKETPLACE_TRUSTED_HOSTS:  ${{ vars.VITE_MARKETPLACE_TRUSTED_HOSTS }}
          # Set either to "true" to drop that import route from the build entirely.
          VITE_DISABLE_MARKETPLACE:        ${{ vars.VITE_DISABLE_MARKETPLACE }}
          VITE_DISABLE_REG_IMPORT:         ${{ vars.VITE_DISABLE_REG_IMPORT }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./WorkspaceOptimizer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
